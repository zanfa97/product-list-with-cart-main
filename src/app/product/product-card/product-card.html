<article>
  <picture>
    <source media="(min-width: 1024px)" [srcset]="product().image.desktop" />
    <source media="(min-width: 600px)" [srcset]="product().image.tablet" />
    <img [src]="product().image.mobile" [alt]="product().name" />
  </picture>
  <div class="product-info">
    <p class="category">{{ product().category }}</p>
    <h2 class="name">{{ product().name }}</h2>
    <p class="price">{{ product().price | currency: 'EUR' }}</p>
  </div>
  @if (quantity() === 0) {
    <button (click)="addToCart()" add-to-cart-btn type="button" label="Add to Cart"></button>
  } @else {
    <div class="quantity-stepper">
      <button type="button" (click)="incrementQuantity(product().id)">+</button>
      <p class="quantity">{{ quantity() }}</p>
      <button type="button" (click)="decrementQuantity(product().id)">-</button>
    </div>
  }
</article>
